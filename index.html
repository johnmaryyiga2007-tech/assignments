<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display"><br><br>

        <button class="btn btn-ac">AC</button>
        <button class="btn">00</button>
        <button class="btn">%</button>
        <button class="btn operation" id="division">÷</button><br><br>

        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="btn operation" id="multiply">×</button><br><br>

        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="btn operation" id="subtraction">-</button><br><br>

        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="btn operation" id="add">+</button><br><br>

        <button class="btn btn-zero" id="zeroo">0</button>
        <button class="btn">.</button>
        <button class="btn operation" id="equals">=</button><br><br>
    </div>
</body>
</html>
